# 前端 nginx 配置（容器内）
# - 80 端口 serve /usr/share/nginx/html
# - /api/* 反代到后端容器 backend:18000
# - SPA fallback：所有非 /api 的 404 → /index.html（React Router）

server {
    listen 80;
    server_name _;
    client_max_body_size 500M;     # 允许大文件上传
    proxy_read_timeout 600s;       # 大 PDF 合并 / 大文件预览超时
    proxy_send_timeout 600s;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # ───── 后端 API 反代 ─────
    # docker compose 内 backend 服务名
    location /api/ {
        proxy_pass http://backend:18000/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 关闭缓冲（流式响应 / SSE 友好）
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ───── 修 I-cache (REVIEW-TRACK2 I3 / REVIEW-TRACK3 I-cache)： ─────
    # PDF inline 预览端点单独加 location：开缓冲 + 关 gzip + 显式 Content-Length。
    # 否则 nginx 的 chunked transfer encoding + PDF.js 在 Safari/Edge 偶发白屏。
    location ~* ^/api/.+/preview-pdf$ {
        proxy_pass http://backend:18000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;               # 等全收到再转发（保留 Content-Length）
        proxy_request_buffering off;
        gzip off;                          # PDF 已是压缩格式
        add_header Accept-Ranges bytes;    # 支持 PDF.js range request
    }
    location ~* ^/api/.+/preview$ {
        # /api/files/{id}/preview 同样适用
        proxy_pass http://backend:18000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_request_buffering off;
        gzip off;
        add_header Accept-Ranges bytes;
    }

    # ───── 静态资源缓存 ─────
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ───── SPA fallback ─────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ───── 错误兜底 ─────
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
