name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# 取消上一次进行中的同 workflow（PR 反复 push 时省 CI 额度）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 默认权限：只读；需要时再显式开
permissions:
  contents: read

jobs:
  # ⓵ 后端测试 — 每个 PR / push 都跑
  backend-test:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -v --tb=short --maxfail=10

  # ⓶ 前端类型检查 + 测试 + build
  frontend-test:
    name: Frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build

  # ⓷ Docker 镜像构建 — 只在 push 到 main / 打 tag 时跑
  # PR 不构建（PR 只验证代码，构建交给合并后）
  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    # PR 不构建
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write   # 推 ghcr.io 需要
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: .
            dockerfile: backend/Dockerfile
          - service: frontend
            context: .
            dockerfile: frontend/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/settlement-mgmt-${{ matrix.service }}
          tags: |
            # main 分支 → latest
            type=raw,value=latest,enable={{is_default_branch}}
            # tag 触发 → 同步打 tag（v0.3.0 → :v0.3.0）
            type=ref,event=tag
            # tag 触发同时打 major.minor
            type=ref,event=tag,pattern=v(.*)
            # main 分支也打 sha 短码（方便追溯）
            type=sha,format=short,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=settlement-mgmt-${{ matrix.service }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 项目有 data/ projects/ 这类运行时目录，不需要打到镜像里
          # Dockerfile 内部已经 COPY 精确路径，所以这里不需要额外 .dockerignore
